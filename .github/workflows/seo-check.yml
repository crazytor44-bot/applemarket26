name: SEO metadata checks
on:
  push:
    paths:
      - 'index.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'catalog/index.html'
      - 'choose/index.html'
      - 'contacts/index.html'
      - 'repair/index.html'
      - 'iphone-*/index.html'
      - 'samsung-*/index.html'
      - 'tests/seo-check.cjs'
      - '.github/workflows/seo-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Verify SEO metadata, sitemap and store info
        run: node tests/seo-check.cjs
