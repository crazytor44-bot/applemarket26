name: One-time remove prices

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-remove-prices.yml'

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove visible prices and add legal link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, product_prices = re.subn(
              r'\n?\s*<div class="product-price">[^<]*₽</div>',
              '',
              text,
          )
          text, hit_prices = re.subn(
              r'\n?\s*<b>\s*[\d\s]+₽\s*</b>',
              '',
              text,
          )

          text = text.replace(
              '⚡ Цены и наличие могут меняться в течение дня — лучше уточнить перед визитом.',
              '⚡ Наличие может меняться в течение дня — лучше уточнить перед визитом.',
          )
          text = text.replace(
              'Наличие и цену лучше уточнить перед покупкой',
              'Наличие лучше уточнить перед покупкой',
          )

          old_footer = '''<footer>\n      Apple Market · Ставрополь · ул. Тухачевского 16к10\n    </footer>'''
          new_footer = '''<footer>\n      Apple Market · Ставрополь · ул. Тухачевского 16к10<br>\n      <a href="/legal.html" style="display:inline-block;margin-top:8px;color:#d7d9e1;text-decoration:underline;text-underline-offset:3px;">Юридическая информация</a>\n    </footer>'''
          if old_footer not in text:
              raise SystemExit('Footer marker not found; refusing to modify index.html')
          text = text.replace(old_footer, new_footer, 1)

          text = text.replace(
              '.product-right { justify-content:space-between; }',
              '.product-right { justify-content:flex-end; }',
          )

          if '₽' in text:
              raise SystemExit('Ruble price text still remains in index.html')
          if '/legal.html' not in text:
              raise SystemExit('Legal link was not added')
          if product_prices < 1 or hit_prices < 1:
              raise SystemExit(f'Unexpected match counts: product={product_prices}, hits={hit_prices}')

          path.write_text(text, encoding='utf-8')
          print(f'Removed {product_prices} catalog prices and {hit_prices} hit prices')
          PY

      - name: Commit site update and remove one-time workflow
        shell: bash
        run: |
          git config user.name "Apple Market site updater"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/one-time-remove-prices.yml
          git add index.html
          git commit -m "Remove prices and add legal information link"
          git push
