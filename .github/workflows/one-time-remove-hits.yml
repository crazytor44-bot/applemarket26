name: One-time remove hits
on:
  push:
    paths:
      - '.github/workflows/one-time-remove-hits.yml'
permissions:
  contents: write
jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove hits section
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove the visible Hits section from heading through its hits grid.
          patterns=[
            r'\s*<h2[^>]*>\s*🔥?\s*Хиты продаж\s*</h2>\s*(?:<p[^>]*>.*?</p>\s*)?<div class="hits">.*?</div>\s*(?=<h2|<section|<div class="section-title"|<div id=)',
            r'\s*<div class="section-title"[^>]*>\s*🔥?\s*Хиты продаж\s*</div>\s*(?:<p[^>]*>.*?</p>\s*)?<div class="hits">.*?</div>\s*'
          ]
          before=s
          for pat in patterns:
            s,n=re.subn(pat,'\n',s,count=1,flags=re.S|re.I)
            if n: break
          # Fallback: locate heading and remove up to next major section marker.
          if s==before:
            m=re.search(r'(<(?:h2|div)[^>]*>[^<]*Хиты продаж[^<]*</(?:h2|div)>)',s,re.I)
            if m:
              start=m.start()
              nxt=re.search(r'\n\s*<(?:section\b|h2\b|div\s+class="section-title")',s[m.end():],re.I)
              if nxt: s=s[:start]+s[m.end()+nxt.start():]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove hits section from homepage" || true
          git rm .github/workflows/one-time-remove-hits.yml
          git commit -m "Remove one-time hits workflow"
          git push
