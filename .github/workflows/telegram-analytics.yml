name: A Market Telegram analytics

on:
  workflow_dispatch:
  schedule:
    # 08:00, 14:00 and 20:00 local Stavropol time (UTC+3).
    - cron: '0 5,11,17 * * *'

permissions:
  contents: read

concurrency:
  group: amarket-public-telegram-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      AMARKET_TELEGRAM_BOT_TOKEN: ${{ secrets.AMARKET_TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser
        run: python3 -m pip install --disable-pip-version-check beautifulsoup4==4.13.5
      - name: Collect public channel stats
        run: python3 telegram_channel/public_stats.py
      - name: Keep report for comparison
        uses: actions/upload-artifact@v4
        with:
          name: telegram-stats-${{ github.run_id }}
          path: |
            telegram_channel/analytics/latest.md
            telegram_channel/analytics/latest.json
          retention-days: 90
