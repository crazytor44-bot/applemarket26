name: A Market owner's viral iPhone 15 Pro video
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'telegram_channel/video_approved/*.json'
      - '.github/workflows/amarket-viral-15pro-video.yml'
      - 'telegram_channel/video_publisher.py'

permissions:
  contents: read
  actions: read

concurrency:
  group: amarket-viral-iphone15pro-publish
  cancel-in-progress: false

jobs:
  publish-once:
    # Never publish on manual testing or action re-runs.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      AMARKET_TELEGRAM_BOT_TOKEN: ${{ secrets.AMARKET_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout repo including prior commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Python syntax check (safe test)
        run: python3 -m py_compile telegram_channel/video_publisher.py telegram_channel/publisher.py
      - name: Find exactly one new owner-approved video post (never post edits or re-runs)
        id: approval
        if: github.event_name == 'push'
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$BEFORE" != "0000000000000000000000000000000000000000"
          git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'telegram_channel/video_approved/' > /tmp/new-video-approvals.txt
          approval="telegram_channel/video_approved/2026-10-15-iphone-15-pro-viral.json"
          if grep -Fxq "$approval" /tmp/new-video-approvals.txt; then
            test "$(wc -l < /tmp/new-video-approvals.txt)" -eq 1
            echo "approval=$approval" >> "$GITHUB_OUTPUT"
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No newly added exact owner-approved video JSON; not posting.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download already prepared owner video from verified GitHub Actions artifact
        if: steps.approval.outputs.publish == 'true'
        uses: actions/download-artifact@v8
        with:
          name: amarket-iphone-15-pro-telegram-ready
          run-id: 38703731281
          repository: crazytor44-bot/applemarket26
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/amarket-owner-viral-video
      - name: Publish original video once (never pin anything)
        if: steps.approval.outputs.publish == 'true'
        shell: bash
        env:
          APPROVAL_FILE: ${{ steps.approval.outputs.approval }}
        run: |
          set -euo pipefail
          test -n "$AMARKET_TELEGRAM_BOT_TOKEN"
          test -f /tmp/amarket-owner-viral-video/iphone-15-pro-telegram.mp4
          python3 telegram_channel/video_publisher.py "$APPROVAL_FILE" /tmp/amarket-owner-viral-video/iphone-15-pro-telegram.mp4
