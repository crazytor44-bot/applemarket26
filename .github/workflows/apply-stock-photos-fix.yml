name: Apply stock and photos fix
on:
  push:
    paths:
      - .github/workflows/apply-stock-photos-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply PlayStation and photo fixes
        env:
          PATCH_B64: 
        run: |
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/fix.patch
          git apply /tmp/fix.patch
          PYTHONPATH=automation python - <<'PY'
          from telegram_price_sync import parse_price_text, load_products, merge_products, save_products, update_yml
          text = '''DualSense PS5 Grey Camouflage - 6.100
          DualSense PS5 Midnight Black - 6.100
          DualSense PS5 Nova Pink - 6.700
          DualSense PS5 Remix Green - 7.000
          DualSense PS5 Rhythm Blue - 7.000
          DualSense PS5 Starlight Blue - 6.100
          DualSense PS5 Sterling Silver - 6.100
          DualSense PS5 Volcanic Red - 6.200
          DualSense PS5 White - 5.900
          Charging Station DualSense - 3.500
          PS5 Disc Drive - 9.000
          Sony Pulse Black - 10.000'''
          source, products = load_products()
          products, stats = merge_products(products, parse_price_text(text))
          save_products(source, products)
          update_yml(products)
          print(stats)
          PY
          PYTHONPATH=automation python -m unittest discover -s automation -p 'test_*.py'
          node --check catalog/catalog.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-stock-photos-fix.yml
          git add automation/telegram_price_sync.py automation/test_price_sync.py catalog/catalog.js catalog/index.html yml.xml
          git commit -m 'Restore PlayStation stock and product photos'
          git push
