name: Sitemap reachability diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sitemap-access-check.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check public DNS and sitemap HTTP responses
        shell: bash
        run: |
          set -u
          echo "DNS A records:"
          dig +short applemarket26.ru A
          echo "DNS AAAA records:"
          dig +short applemarket26.ru AAAA
          for endpoint in / /robots.txt /sitemap.xml /sitemap.txt /google6169ec6747538b34.html; do
            echo "===== $endpoint ====="
            for agent in 'Mozilla/5.0' 'Googlebot'; do
              echo "UA=$agent"
              curl -4 -sS -L --max-time 20 -A "$agent" -o /tmp/page -D /tmp/headers \
                -w "HTTP=%{http_code} IP=%{remote_ip} redirects=%{num_redirects} type=%{content_type} bytes=%{size_download}\n" \
                "https://applemarket26.ru$endpoint" || true
              head -n 12 /tmp/headers || true
              echo "response first 130 bytes:"
              head -c 130 /tmp/page || true
              echo
            done
          done
          echo "===== IPv6 check ====="
          curl -6 -sS -L --max-time 12 -o /dev/null -w "HTTP=%{http_code} IP=%{remote_ip}\n" \
            "https://applemarket26.ru/sitemap.xml" || true
