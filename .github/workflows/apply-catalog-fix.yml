name: Apply catalog fix
on:
  push:
    paths:
      - .github/workflows/apply-catalog-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and publish corrected catalog
        env:
          PATCH_B64: 
          CATEGORY_FIELDSET: '<fieldset class="catalog-categories"><legend class="visually-hidden">Категория</legend><button type="button" class="choice" data-category="iphone" aria-pressed="true">iPhone</button><button type="button" class="choice" data-category="samsung" aria-pressed="false">Samsung</button><button type="button" class="choice" data-category="xiaomi" aria-pressed="false">Xiaomi · Poco</button><button type="button" class="choice" data-category="honor" aria-pressed="false">Honor</button><button type="button" class="choice" data-category="mac" aria-pressed="false">Mac</button><button type="button" class="choice" data-category="ipad" aria-pressed="false">iPad</button><button type="button" class="choice" data-category="watch" aria-pressed="false">Apple Watch</button><button type="button" class="choice" data-category="airpods" aria-pressed="false">AirPods</button><button type="button" class="choice" data-category="beauty" aria-pressed="false">Красота</button><button type="button" class="choice" data-category="cameras" aria-pressed="false">Камеры</button><button type="button" class="choice" data-category="glasses" aria-pressed="false">Умные очки</button><button type="button" class="choice" data-category="gaming" aria-pressed="false">PlayStation</button><button type="button" class="choice" data-category="accessories" aria-pressed="false">Аксессуары</button><button type="button" class="choice" data-category="collectibles" aria-pressed="false">Коллекционное</button></fieldset>'
        run: |
          python - <<'PY'
          import json
          from automation.telegram_price_sync import load_products
          _, products = load_products()
          entries = [
              {"name": p.get("supplierName") or p["name"], "supplier_price": max(int(p["price"]) - 2000, 0)}
              for p in products if p.get("source") == "icenter"
          ]
          with open('/tmp/icenter.json', 'w', encoding='utf-8') as fh:
              json.dump(entries, fh, ensure_ascii=False)
          PY
          git checkout 7a0b8dd -- catalog/index.html yml.xml
          printf '%s' "$PATCH_B64" | base64 -d | gzip -d > /tmp/fix.patch
          git apply /tmp/fix.patch
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          from automation.telegram_price_sync import PriceEntry, normal_key, load_products, merge_products, save_products, update_yml
          with open('/tmp/icenter.json', encoding='utf-8') as fh:
              raw = json.load(fh)
          entries = [PriceEntry(name=x['name'], supplier_price=x['supplier_price'], key=normal_key(x['name'])) for x in raw if x['supplier_price'] > 0]
          source, products = load_products()
          products, stats = merge_products(products, entries)
          save_products(source, products)
          update_yml(products)
          path = Path('catalog/index.html')
          html = path.read_text(encoding='utf-8')
          html, count = re.subn(r'<fieldset class="catalog-categories">.*?</fieldset>', os.environ['CATEGORY_FIELDSET'], html, count=1)
          if count != 1:
              raise RuntimeError('category fieldset not found')
          path.write_text(html, encoding='utf-8')
          print(stats)
          PY
          PYTHONPATH=automation python -m unittest discover -s automation -p 'test_*.py'
          node --check catalog/catalog.js
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-catalog-fix.yml
          git add automation catalog yml.xml
          git commit -m 'Fix Telegram catalog matching and grouping'
          git push
