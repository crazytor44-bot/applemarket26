name: Trade-in estimate checks
on:
  push:
    paths:
      - 'trade-in/index.html'
      - 'assets/trade-estimator*'
      - 'assets/trade-estimates.json'
      - 'tests/trade-estimator.cjs'
      - '.github/workflows/trade-estimator-check.yml'
  pull_request:
    paths:
      - 'trade-in/index.html'
      - 'assets/trade-estimator*'
      - 'assets/trade-estimates.json'
      - 'tests/trade-estimator.cjs'
      - '.github/workflows/trade-estimator-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trade_in:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check assets/trade-estimator-core.js
          node --check assets/trade-estimator.js
      - name: Run calculator and integration tests
        run: node tests/trade-estimator.cjs
