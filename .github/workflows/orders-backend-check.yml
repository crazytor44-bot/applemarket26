name: Yandex orders backend safety checks
on:
  push:
    paths:
      - 'backend/yandex-orders/**'
      - '.github/workflows/orders-backend-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check Python syntax
        run: python -m py_compile backend/yandex-orders/index.py backend/yandex-orders/test_handler.py
      - name: Run handler security and request tests without accessing cloud
        run: python -m unittest discover -s backend/yandex-orders -p 'test_*.py' -v
