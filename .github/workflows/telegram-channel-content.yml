name: A Market Telegram content

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Действие с каналом (без новых постов)'
        type: choice
        required: true
        default: check
        options:
          - check
          - brand
          - avatar
  push:
    branches: [main]
    paths:
      - 'telegram_channel/approved/*.json'
      - 'telegram_channel/avatar-setup.request'
      - '.github/workflows/telegram-channel-content.yml'
      - 'telegram_channel/publisher.py'

permissions:
  contents: read

concurrency:
  group: amarket-telegram-channel
  cancel-in-progress: false

jobs:
  manage-telegram:
    # An automatic rerun must never accidentally duplicate a published post.
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    env:
      AMARKET_TELEGRAM_BOT_TOKEN: ${{ secrets.AMARKET_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check configuration
        shell: bash
        run: |
          if [[ -z "$AMARKET_TELEGRAM_BOT_TOKEN" ]]; then
            echo "Не задан secret AMARKET_TELEGRAM_BOT_TOKEN." >&2
            exit 1
          fi

      - name: Check Python syntax
        run: python3 -m py_compile telegram_channel/publisher.py

      - name: Verify rights to publish and pin
        if: github.event_name == 'push'
        run: python3 telegram_channel/publisher.py check-pin

      - name: Install image support
        if: github.event_name == 'push'
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Check Telegram bot
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'check'
        run: python3 telegram_channel/publisher.py check

      - name: Change channel name and description
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'brand'
        run: python3 telegram_channel/publisher.py brand

      - name: Change channel avatar manually
        if: github.event_name == 'workflow_dispatch' && inputs.operation == 'avatar'
        run: python3 telegram_channel/publisher.py avatar

      - name: Set AMarket avatar on initial avatar request
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          if git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'telegram_channel/avatar-setup.request' | grep -Fxq 'telegram_channel/avatar-setup.request'; then
            echo "Setting the AMarket logo as the Telegram channel avatar..."
            python3 telegram_channel/publisher.py avatar
          else
            echo "No new avatar request."
          fi

      - name: First-time channel setup (only when workflow file is newly added)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        shell: bash
        run: |
          if git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- '.github/workflows/telegram-channel-content.yml' | grep -Fxq '.github/workflows/telegram-channel-content.yml'; then
            echo "Applying initial A Market channel name and description..."
            python3 telegram_channel/publisher.py brand
          else
            echo "Channel already configured; skipping branding."
          fi

      - name: Publish newly approved files (one time, added files only)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          import sys

          before, after = os.environ["BEFORE"], os.environ["AFTER"]
          if before == "0" * 40:
              print("Initial push ignored (to avoid bulk publishing).")
              sys.exit(0)
          files = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=A", before, after, "--", "telegram_channel/approved/"],
              text=True,
          ).splitlines()
          for path in files:
              if path.endswith(".json"):
                  print(f"Publishing approved post from {path}")
                  subprocess.run(["python3", "telegram_channel/publisher.py", "post", path], check=True)
          if not files:
              print("No newly approved post files.")
          PY
