name: Legacy A Market channel manager — check only

# Archived after unintended channel branding/avatar changes on 2026-10-27.
# Deliberately has no push or scheduled trigger and cannot publish or alter branding.
# The active publishing path is telegram_channel/post_queue/*.json.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-only:
    runs-on: ubuntu-latest
    env:
      AMARKET_TELEGRAM_BOT_TOKEN: ${{ secrets.AMARKET_TELEGRAM_BOT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check Telegram bot without changing the channel
        run: python3 telegram_channel/publisher.py check
