name: A Market inspect owner's Instagram reel
on:
  push:
    paths:
      - '.github/workflows/amarket-instagram-reel-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try to retrieve user's publicly shared original reel (do not publish)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -q yt-dlp
          set +e
          yt-dlp --no-playlist --no-warnings --retries 1 --socket-timeout 12 --extractor-retries 1 --format 'bv*+ba/best' --merge-output-format mp4 --output '/tmp/amarket_15_pro.%(ext)s' 'https://www.instagram.com/reel/DY-WN_Ktb8e/'
          rc=$?
          set -e
          echo "YT_DLP_EXIT_CODE=$rc"
          if test "$rc" -eq 0; then
            echo 'VIDEO_METADATA:'
            for f in /tmp/amarket_15_pro.*; do
              file "$f"
              du -h "$f"
              ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 "$f" || true
            done
          else
            echo 'DOWNLOAD_FAILED: original owner video was not obtainable through public Instagram access'
          fi
