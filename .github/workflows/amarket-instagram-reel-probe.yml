name: A Market stage owner's original Instagram reel
on:
  push:
    paths:
      - '.github/workflows/amarket-instagram-reel-probe.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Get ffmpeg and yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -qq -y ffmpeg >/dev/null
          python3 -m pip install -q yt-dlp
      - name: Download and check owner's original video (NO publication)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/amarket-video
          yt-dlp --no-playlist --no-warnings --retries 2 --socket-timeout 20 --format 'bv*+ba/best' --merge-output-format mp4 --output '/tmp/amarket-video/iphone-15-pro-marketplace.%(ext)s' 'https://www.instagram.com/reel/DY-WN_Ktb8e/'
          test -s /tmp/amarket-video/iphone-15-pro-marketplace.mp4
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_type,codec_name -of json /tmp/amarket-video/iphone-15-pro-marketplace.mp4
          sha256sum /tmp/amarket-video/iphone-15-pro-marketplace.mp4
      - name: Store original video for owner (nothing sent to Telegram)
        uses: actions/upload-artifact@v4
        with:
          name: amarket-instagram-iphone15pro-original
          path: /tmp/amarket-video/iphone-15-pro-marketplace.mp4
          retention-days: 14
